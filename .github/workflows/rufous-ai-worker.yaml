name: Rufous Workers AI Free augmentation

on:
  push:
    branches: [main]
    paths:
      - "workers/rufous-ai/**"
      - ".github/workflows/rufous-ai-worker.yaml"
  pull_request:
    branches: [main]
    paths:
      - "workers/rufous-ai/**"
      - ".github/workflows/rufous-ai-worker.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rufous-ai-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test the isolated AI Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/rufous-ai/package-lock.json
      - name: Install the checksum-locked Worker dependencies
        run: npm --prefix workers/rufous-ai ci
      - name: Install the release-policy test dependencies
        run: uv sync --all-extras --dev --locked
      - name: Enforce the static Pages and Workers Free boundaries
        run: >-
          uv run pytest tests/rufous_media/test_public_export_audit.py
          tests/cloudflare/test_rufous_ai_workflow.py
          -o "addopts=-v --tb=short"
      - name: Test the fixed request, fallback, and quota-exhaustion contracts
        run: npm --prefix workers/rufous-ai test
      - name: Type-check the Worker
        run: npm --prefix workers/rufous-ai run typecheck

  deploy:
    name: Deploy the reviewed Workers Free service
    needs: test
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUF_AI_RELEASE_ENABLED: ${{ vars.RUF_AI_RELEASE_ENABLED }}
      RUF_AI_WORKERS_PLAN: ${{ vars.RUF_AI_WORKERS_PLAN }}
      RUF_AI_ACCOUNT_ID: ${{ vars.RUF_AI_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/rufous-ai/package-lock.json
      - name: Enforce the manually reviewed Workers Free release gate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUF_AI_RELEASE_ENABLED" != "true" ]]; then
            echo "Rufous AI deployment is disabled until Workers Free is manually reconfirmed." >&2
            exit 1
          fi
          if [[ "$RUF_AI_WORKERS_PLAN" != "free" ]]; then
            echo "Rufous AI deploy requires the exact reviewed Workers Free plan attestation." >&2
            exit 1
          fi
          for name in RUF_AI_ACCOUNT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Required isolated AI deployment configuration is missing." >&2
              exit 1
            fi
          done
      - name: Verify this revision is still the main branch head
        shell: bash
        run: |
          read -r main_sha _ < <(git ls-remote --refs origin refs/heads/main)
          if [[ ! "$main_sha" =~ ^[0-9a-f]{40}$ || "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "Refusing to deploy a superseded main revision." >&2
            exit 1
          fi
      - name: Install only the checksum-locked Worker dependencies
        run: npm --prefix workers/rufous-ai ci
      - name: Deploy only the reviewed AI Worker
        working-directory: workers/rufous-ai
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.RUF_AI_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.RUF_AI_WORKER_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "The isolated Rufous AI deployment token is missing." >&2
            exit 1
          fi
          npm exec wrangler deploy -- --config wrangler.jsonc
