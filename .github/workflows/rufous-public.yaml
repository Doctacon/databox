name: Rufous public R2-backed release

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "config/rufous-media-visual-approvals.json"
      - "config/rufous-pinned-public-media.json"
      - "config/rufous-pinned-public-audio.json"
      - "config/rufous-public-audio-selection.json"
      - "config/rufous-wikimedia-public-media.json"
      - "pyproject.toml"
      - "packages/databox/pyproject.toml"
      - "packages/databox-sources/pyproject.toml"
      - "packages/databox-sources/databox_sources/gbif/**"
      - "packages/databox-sources/databox_sources/_public_inaturalist/**"
      - "packages/databox-sources/databox_sources/usfws/**"
      - "packages/databox-sources/tests/gbif/**"
      - "packages/databox-sources/tests/inaturalist/**"
      - "packages/databox-sources/tests/usfws/**"
      - "packages/databox-sources/tests/conftest.py"
      - "packages/databox-sources/tests/test_vcr_sanitization.py"
      - "packages/databox/databox/config/settings.py"
      - "packages/databox/databox/config/sources.py"
      - "packages/databox/databox/orchestration/definitions.py"
      - "packages/databox/databox/orchestration/domains/gbif.py"
      - "packages/databox/databox/orchestration/domains/usfws.py"
      - "packages/databox/databox/public_inaturalist_media_ingest.py"
      - "packages/databox/databox/public_export*.py"
      - "packages/databox/databox/public_audio*.py"
      - "packages/databox/databox/public_media*.py"
      - "packages/databox/databox/public_restricted_marks.py"
      - "packages/databox/databox/public_release.py"
      - "packages/databox/databox/public_release_hydrate.py"
      - "scripts/load_dlt_quack.py"
      - "scripts/*rufous_public.py"
      - "scripts/*rufous*media.py"
      - "scripts/build_rufous_media_review.py"
      - "scripts/compose_rufous_media_pin.py"
      - "scripts/verify_rufous_media_approvals.py"
      - "scripts/sqlmesh_plan_rufous_public.sh"
      - "scripts/sqlmesh_plan_rufous_media.sh"
      - "scripts/sqlmesh_plan_rufous_inaturalist_media.sh"
      - "soda/contracts/birding_agent/gbif_occurrence_evidence.yaml"
      - "soda/contracts/environmental_observations/fact_bird_occurrence.yaml"
      - "soda/contracts/rufous_public/**"
      - "tests/test_public_export*.py"
      - "tests/test_public_audio*.py"
      - "tests/test_public_release.py"
      - "tests/test_public_release_hydrate.py"
      - "tests/test_rufous_public_workflow.py"
      - "tests/test_rufous_wikimedia_public_media.py"
      - "tests/test_public_media*.py"
      - "tests/test_public_inaturalist_media_ingest.py"
      - "tests/test_settings.py"
      - "tests/test_source_builders.py"
      - "tests/test_source_registry.py"
      - "transforms/main/models/birding_agent/**"
      - "transforms/main/models/environmental_observations/**"
      - "transforms/main/models/rufous_public/**"
      - "transforms/main/tests/**"
      - "uv.lock"
      - "functions/**"
      - "worker.js"
      - "worker.mjs"
      - "worker.ts"
      - "_worker.js"
      - "wrangler.toml"
      - "wrangler.json"
      - "wrangler.jsonc"
      - ".wrangler/deploy/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "config/rufous-media-visual-approvals.json"
      - "config/rufous-pinned-public-media.json"
      - "config/rufous-pinned-public-audio.json"
      - "config/rufous-public-audio-selection.json"
      - "config/rufous-wikimedia-public-media.json"
      - "pyproject.toml"
      - "packages/databox/pyproject.toml"
      - "packages/databox-sources/pyproject.toml"
      - "packages/databox-sources/databox_sources/gbif/**"
      - "packages/databox-sources/databox_sources/_public_inaturalist/**"
      - "packages/databox-sources/databox_sources/usfws/**"
      - "packages/databox-sources/tests/gbif/**"
      - "packages/databox-sources/tests/inaturalist/**"
      - "packages/databox-sources/tests/usfws/**"
      - "packages/databox-sources/tests/conftest.py"
      - "packages/databox-sources/tests/test_vcr_sanitization.py"
      - "packages/databox/databox/config/settings.py"
      - "packages/databox/databox/config/sources.py"
      - "packages/databox/databox/orchestration/definitions.py"
      - "packages/databox/databox/orchestration/domains/gbif.py"
      - "packages/databox/databox/orchestration/domains/usfws.py"
      - "packages/databox/databox/public_inaturalist_media_ingest.py"
      - "packages/databox/databox/public_export*.py"
      - "packages/databox/databox/public_audio*.py"
      - "packages/databox/databox/public_media*.py"
      - "packages/databox/databox/public_restricted_marks.py"
      - "packages/databox/databox/public_release.py"
      - "packages/databox/databox/public_release_hydrate.py"
      - "scripts/load_dlt_quack.py"
      - "scripts/*rufous_public.py"
      - "scripts/*rufous*media.py"
      - "scripts/build_rufous_media_review.py"
      - "scripts/compose_rufous_media_pin.py"
      - "scripts/verify_rufous_media_approvals.py"
      - "scripts/sqlmesh_plan_rufous_public.sh"
      - "scripts/sqlmesh_plan_rufous_media.sh"
      - "scripts/sqlmesh_plan_rufous_inaturalist_media.sh"
      - "soda/contracts/birding_agent/gbif_occurrence_evidence.yaml"
      - "soda/contracts/environmental_observations/fact_bird_occurrence.yaml"
      - "soda/contracts/rufous_public/**"
      - "tests/test_public_export*.py"
      - "tests/test_public_audio*.py"
      - "tests/test_public_release.py"
      - "tests/test_public_release_hydrate.py"
      - "tests/test_rufous_public_workflow.py"
      - "tests/test_rufous_wikimedia_public_media.py"
      - "tests/test_public_media*.py"
      - "tests/test_public_inaturalist_media_ingest.py"
      - "tests/test_settings.py"
      - "tests/test_source_builders.py"
      - "tests/test_source_registry.py"
      - "transforms/main/models/birding_agent/**"
      - "transforms/main/models/environmental_observations/**"
      - "transforms/main/models/rufous_public/**"
      - "transforms/main/tests/**"
      - "uv.lock"
      - "functions/**"
      - "worker.js"
      - "worker.mjs"
      - "worker.ts"
      - "_worker.js"
      - "wrangler.toml"
      - "wrangler.json"
      - "wrangler.jsonc"
      - ".wrangler/deploy/**"
      - ".github/workflows/**"
  schedule:
    - cron: "17 7 2 * *"
  workflow_dispatch:
    inputs:
      release_mode:
        description: Release scope
        type: choice
        required: true
        default: full
        options:
          - full
          - media-refresh
          - audio-refresh
          - pages-only
      media_provider:
        description: Explicit provider for a manual media refresh
        type: choice
        required: true
        default: inaturalist
        options:
          - inaturalist
          - wikimedia

permissions:
  contents: read

env:
  # These are public release coordinates, not credentials. Keeping them in the
  # reviewed workflow prevents a missing repository variable from silently
  # disabling production while credentials remain secret-only.
  RUFOUS_PUBLIC_DATA_URL: https://rufous-data.loughondata.com/rufous-public
  RUFOUS_R2_BUCKET: rufous-public-data

concurrency:
  group: rufous-public-${{ ((github.event_name == 'schedule') || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && 'production' || (github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)) || format('nonproduction-{0}', github.run_id) }}
  # Never cancel an activation after immutable objects may have been written.
  # The publisher also uses a conditional pointer write, but serial execution
  # keeps release ordering and the Pages fallback easy to reason about.
  cancel-in-progress: false

jobs:
  route:
    name: Route Rufous release scope
    runs-on: ubuntu-latest
    outputs:
      release_mode: ${{ steps.route.outputs.release_mode }}
    steps:
      - if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: route
        name: Fail closed unless a push has one reviewed narrow scope
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          DISPATCH_MODE: ${{ inputs.release_mode }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          release_mode=none
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            release_mode=full
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$DISPATCH_MODE" == "pages-only" ]]; then
              release_mode=pages
            elif [[ "$DISPATCH_MODE" == "media-refresh" ]]; then
              release_mode=media
            elif [[ "$DISPATCH_MODE" == "audio-refresh" ]]; then
              release_mode=audio
            else
              release_mode=full
            fi
          elif [[ "$EVENT_NAME" == "push" && "$RELEASE_REF" == "refs/heads/main" ]]; then
            release_mode=full
            if [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] \
              && [[ ! "$BEFORE_SHA" =~ ^0+$ ]] \
              && git cat-file -e "$BEFORE_SHA^{commit}" \
              && git cat-file -e "$HEAD_SHA^{commit}"; then
              changed_count=0
              app_only=true
              audio_maintenance_change=false
              media_maintenance_change=false
              while IFS= read -r -d '' path; do
                changed_count=$((changed_count + 1))
                if [[ "$path" != app/* ]]; then
                  app_only=false
                fi
                case "$path" in
                  config/rufous-pinned-public-audio.json|\
                  config/rufous-public-audio-selection.json|\
                  packages/databox/databox/public_audio*.py|\
                  tests/test_public_audio*.py)
                    audio_maintenance_change=true
                    ;;
                esac
                case "$path" in
                  config/rufous-media-visual-approvals.json|\
                  config/rufous-pinned-public-media.json|\
                  config/rufous-wikimedia-public-media.json)
                    media_maintenance_change=true
                    ;;
                esac
              done < <(git diff --no-renames --name-only --diff-filter=ACMRD -z "$BEFORE_SHA" "$HEAD_SHA")
              if [[ "$changed_count" -gt 0 && "$audio_maintenance_change" == "true" ]]; then
                release_mode=none
              elif [[ "$changed_count" -gt 0 && "$media_maintenance_change" == "true" ]]; then
                release_mode=none
              elif [[ "$changed_count" -gt 0 && "$app_only" == "true" ]]; then
                release_mode=pages
              fi
            fi
          fi
          echo "release_mode=$release_mode" >> "$GITHUB_OUTPUT"

  readiness:
    name: Check Pages release configuration
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      pages_ready: ${{ steps.ready.outputs.pages_ready }}
    env:
      RELEASE_ENABLED: ${{ vars.RUF_PUBLIC_RELEASE_ENABLED }}
      PUBLIC_URL: ${{ vars.RUF_PUBLIC_URL }}
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - id: ready
        name: Evaluate without printing configuration
        shell: bash
        run: |
          pages_ready=true
          if [[ "$RELEASE_ENABLED" != "true" ]]; then
            pages_ready=false
          fi
          for name in PUBLIC_URL RUFOUS_PUBLIC_DATA_URL PAGES_PROJECT CF_ACCOUNT CF_TOKEN; do
            if [[ -z "${!name}" ]]; then
              pages_ready=false
            fi
          done
          if [[ ! "$PUBLIC_URL" =~ ^https:// ]] || [[ "$RUFOUS_PUBLIC_DATA_URL" != "https://rufous-data.loughondata.com/rufous-public" ]]; then
            pages_ready=false
          fi
          echo "pages_ready=$pages_ready" >> "$GITHUB_OUTPUT"

  production_readiness:
    name: Check R2 release configuration
    needs: [readiness, route]
    if: >-
      (needs.readiness.outputs.pages_ready == 'true' ||
       needs.route.outputs.release_mode == 'audio') &&
      (needs.route.outputs.release_mode == 'full' ||
       needs.route.outputs.release_mode == 'media' ||
       needs.route.outputs.release_mode == 'audio') &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    outputs:
      production_ready: ${{ steps.ready.outputs.production_ready }}
    env:
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.RUF_R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.RUF_R2_SECRET_ACCESS_KEY }}
    steps:
      - id: ready
        name: Evaluate without printing configuration
        shell: bash
        run: |
          production_ready=true
          for name in RUFOUS_R2_BUCKET CF_ACCOUNT R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            if [[ -z "${!name}" ]]; then
              production_ready=false
            fi
          done
          echo "production_ready=$production_ready" >> "$GITHUB_OUTPUT"

  synthetic:
    name: Build synthetic static preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install Python dependencies
        run: uv sync --all-extras --dev --locked
      - name: Install browser dependencies
        run: npm --prefix app ci
      - name: Test public exporter and release invariant
        run: >-
          uv run pytest packages/databox-sources/tests/usfws
          packages/databox-sources/tests/inaturalist
          tests/test_analytics_contract_inventory.py
          tests/test_public_export.py tests/test_public_export_audit.py
          tests/test_public_audio_export.py tests/test_public_audio_release.py
          tests/test_public_audio_selection.py
          tests/test_public_release.py tests/test_public_media.py
          tests/test_public_release_hydrate.py
          tests/test_rufous_public_workflow.py
          tests/test_public_media_approval.py
          tests/test_public_media_ingest.py tests/test_public_inaturalist_media_ingest.py
          tests/test_public_media_release.py
          tests/test_public_media_review.py
          tests/test_public_wikimedia_media_ingest.py
          tests/test_rufous_wikimedia_public_media.py
          tests/test_source_builders.py tests/test_source_registry.py
          -o "addopts=-v --tb=short"
      - name: Test public SQLMesh publication model
        working-directory: transforms/main
        run: |
          ../../.venv/bin/sqlmesh test -k test_rufous_public_gbif_eod_occurrence
          ../../.venv/bin/sqlmesh test -k test_rufous_public_usfws_commercial_image
          ../../.venv/bin/sqlmesh test -k test_rufous_public_inaturalist_commercial_image
      - name: Test public browser application
        run: |
          npm --prefix app run typecheck
          npm --prefix app test -- --reporter=dot
      - name: Export fictional public data
        run: >-
          uv run python scripts/export_rufous_public.py
          --mode synthetic --output build/rufous-public-data
      - name: Exercise the atomic object-store release locally
        run: >-
          uv run python scripts/publish_rufous_public.py
          --source build/rufous-public-data
          --local-root build/rufous-r2-preview
          --prefix rufous-public
      - name: Build static public app
        run: npm --prefix app run build:public
      - name: Replace checked-in fixtures with audited exporter output
        run: |
          rm -rf app/dist/data
          cp -R build/rufous-public-data/data app/dist/data
      - name: Enforce public release boundary
        run: >-
          uv run python scripts/audit_rufous_public.py app/dist
          --workflows .github/workflows
          --repository-root .

  pages:
    name: Build and deploy the R2-backed static app shell
    needs: [readiness, route]
    if: >-
      needs.readiness.outputs.pages_ready == 'true' &&
      needs.route.outputs.release_mode == 'pages' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: |
          uv sync --all-extras --dev --locked
          npm --prefix app ci
      - name: Test the shell-only release contract and public browser application
        run: |
          uv run pytest \
            tests/test_public_export_audit.py \
            tests/test_rufous_public_workflow.py \
            -o "addopts=-v --tb=short"
          npm --prefix app run typecheck
          npm --prefix app test -- --reporter=dot
      - name: Build static public app
        env:
          VITE_RUFOUS_DATA_BASE_URL: ${{ env.RUFOUS_PUBLIC_DATA_URL }}
        run: npm --prefix app run build:public
      - name: Remove bundled fixture data from the R2-only production shell
        run: rm -rf app/dist/data
      - name: Audit browser bundle configuration
        run: uv run python scripts/audit_app_bundle.py
      - name: Enforce the shell-only public release boundary
        run: >-
          uv run python scripts/audit_rufous_public.py app/dist --shell-only
          --workflows .github/workflows
          --repository-root .
      - name: Verify this revision is still the main branch head
        shell: bash
        run: |
          read -r main_sha _ < <(git ls-remote --refs origin refs/heads/main)
          if [[ ! "$main_sha" =~ ^[0-9a-f]{40}$ || "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "Refusing to deploy a revision that is no longer the main branch head." >&2
            exit 1
          fi
      - name: Deploy immutable static Pages release
        working-directory: ${{ runner.temp }}
        env:
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          "${{ github.workspace }}/app/node_modules/.bin/wrangler" pages deploy
          "${{ github.workspace }}/app/dist"
          --project-name "$CLOUDFLARE_PAGES_PROJECT"
          --branch main
          --commit-hash "${{ github.sha }}"

  media_delta:
    name: Explicitly add approved media to the active release
    needs: [production_readiness, route]
    if: >-
      needs.production_readiness.outputs.production_ready == 'true' &&
      needs.route.outputs.release_mode == 'media' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.release_mode == 'media-refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUNTIME__DLTHUB_TELEMETRY: "false"
      SQLMESH__DISABLE_ANONYMIZED_ANALYTICS: "true"
      DAGSTER_HOME: ${{ github.workspace }}/.dagster
      RUFOUS_MEDIA_PROVIDER: ${{ inputs.media_provider }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: |
          mkdir -p "$DAGSTER_HOME"
          uv sync --all-extras --dev --locked
          npm --prefix app ci
      - name: Test the bounded media-delta release path
        run: >-
          uv run pytest packages/databox-sources/tests/inaturalist
          tests/test_public_export.py tests/test_public_export_audit.py
          tests/test_public_release.py tests/test_public_release_hydrate.py
          tests/test_public_inaturalist_media_ingest.py
          tests/test_public_wikimedia_media_ingest.py
          tests/test_public_media.py tests/test_public_media_approval.py
          tests/test_public_media_delta.py tests/test_public_media_pin.py
          tests/test_public_media_release.py
          tests/test_rufous_public_workflow.py
          -o "addopts=-v --tb=short"
      - name: Test the iNaturalist publication model
        working-directory: transforms/main
        run: ../../.venv/bin/sqlmesh test -k test_rufous_public_inaturalist_commercial_image
      - name: Test public browser application
        run: |
          npm --prefix app run typecheck
          npm --prefix app test -- --reporter=dot
      - name: Build static public app
        env:
          VITE_RUFOUS_DATA_BASE_URL: ${{ env.RUFOUS_PUBLIC_DATA_URL }}
        run: npm --prefix app run build:public
      - name: Hydrate the verified active production snapshot
        run: uv run python scripts/hydrate_rufous_public.py app/dist
      - name: Verify the complete pinned immutable media catalog
        run: >-
          uv run python scripts/verify_rufous_media_approvals.py
          --manifest config/rufous-pinned-public-media.json
          --approvals config/rufous-media-visual-approvals.json
      - id: pending-media
        name: Identify only newly approved unpictured provider species
        shell: bash
        run: |
          pending_count=$(uv run python -c 'import os; from pathlib import Path; from databox.public_media_delta import load_pending_public_media_selections; print(len(load_pending_public_media_selections(Path("app/dist"), Path("config/rufous-media-visual-approvals.json"), provider=os.environ["RUFOUS_MEDIA_PROVIDER"])))')
          if [[ ! "$pending_count" =~ ^[0-9]+$ ]]; then
            echo "Pending media count is invalid." >&2
            exit 1
          fi
          echo "pending_count=$pending_count" >> "$GITHUB_OUTPUT"
      - name: Stop cleanly when every approved image is already live
        if: steps.pending-media.outputs.pending_count == '0'
        run: echo "No newly approved unpictured species; no provider or deployment work is needed."
      - name: Refresh only newly committed iNaturalist selections
        if: >-
          steps.pending-media.outputs.pending_count != '0' &&
          env.RUFOUS_MEDIA_PROVIDER == 'inaturalist'
        run: |
          uv run python -m databox.public_inaturalist_media_ingest \
            --database data/databox.duckdb \
            --approvals config/rufous-media-visual-approvals.json \
            --targets-from-public-output app/dist
          bash scripts/sqlmesh_plan_rufous_inaturalist_media.sh
      - name: Initialize the isolated Wikimedia media warehouse
        if: >-
          steps.pending-media.outputs.pending_count != '0' &&
          env.RUFOUS_MEDIA_PROVIDER == 'wikimedia'
        run: |
          mkdir -p data
          uv run python -c 'import duckdb; duckdb.connect("data/databox.duckdb").close()'
      - name: Load only the committed offline Wikimedia metadata
        if: >-
          steps.pending-media.outputs.pending_count != '0' &&
          env.RUFOUS_MEDIA_PROVIDER == 'wikimedia'
        run: >-
          uv run python scripts/load_rufous_wikimedia_media.py
          --database data/databox.duckdb
          --input config/rufous-wikimedia-public-media.json
          --targets-from-public-output app/dist
      - name: Prepare only approved provider WebP candidates
        if: steps.pending-media.outputs.pending_count != '0'
        run: |
          uv run python scripts/prepare_rufous_media.py \
            --database-path data/databox.duckdb \
            --output-dir build/rufous-selected-media \
            --provider "$RUFOUS_MEDIA_PROVIDER" \
            --approvals config/rufous-media-visual-approvals.json
      - name: Verify provider-scoped human image approvals
        if: steps.pending-media.outputs.pending_count != '0'
        run: >-
          uv run python scripts/verify_rufous_media_approvals.py
          --manifest build/rufous-selected-media/manifest.json
          --approvals config/rufous-media-visual-approvals.json
          --provider "$RUFOUS_MEDIA_PROVIDER"
      - name: Bind prepared provider media to the committed public pin
        if: steps.pending-media.outputs.pending_count != '0'
        run: >-
          uv run python scripts/compose_rufous_media_pin.py
          --verify-pinned config/rufous-pinned-public-media.json
          --prepared build/rufous-selected-media/manifest.json
          --approvals config/rufous-media-visual-approvals.json
          --provider "$RUFOUS_MEDIA_PROVIDER"
      - name: Apply the bounded media delta to the active snapshot
        if: steps.pending-media.outputs.pending_count != '0'
        run: >-
          uv run python scripts/apply_rufous_media_delta.py
          --active-root app/dist
          --prepared-media-dir build/rufous-selected-media
          --approvals config/rufous-media-visual-approvals.json
          --output-root build/rufous-public-data
          --provider "$RUFOUS_MEDIA_PROVIDER"
      - name: Install the audited delta data contract
        if: steps.pending-media.outputs.pending_count != '0'
        run: |
          rm -rf app/dist/data
          cp -R build/rufous-public-data/data app/dist/data
      - name: Audit browser bundle configuration
        if: steps.pending-media.outputs.pending_count != '0'
        run: uv run python scripts/audit_app_bundle.py
      - name: Enforce the complete public release boundary
        if: steps.pending-media.outputs.pending_count != '0'
        run: >-
          uv run python scripts/audit_rufous_public.py app/dist
          --workflows .github/workflows
          --repository-root .
      - name: Verify this revision is still the main branch head
        if: steps.pending-media.outputs.pending_count != '0'
        shell: bash
        run: |
          read -r main_sha _ < <(git ls-remote --refs origin refs/heads/main)
          if [[ ! "$main_sha" =~ ^[0-9a-f]{40}$ || "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "Refusing to release media from a superseded main revision." >&2
            exit 1
          fi
      - name: Preflight monotonic R2 activation before Pages deployment
        if: steps.pending-media.outputs.pending_count != '0'
        env:
          RUFOUS_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RUFOUS_R2_ACCESS_KEY_ID: ${{ secrets.RUF_R2_ACCESS_KEY_ID }}
          RUFOUS_R2_SECRET_ACCESS_KEY: ${{ secrets.RUF_R2_SECRET_ACCESS_KEY }}
        run: >-
          uv run --package databox --extra r2 --locked
          python scripts/publish_rufous_public.py
          --source build/rufous-public-data
          --r2
          --prefix rufous-public
          --publication-sequence "$GITHUB_RUN_ID"
          --publication-attempt "$GITHUB_RUN_ATTEMPT"
          --source-revision "$GITHUB_SHA"
          --dry-run
      - name: Preflight only the approved provider media objects
        if: steps.pending-media.outputs.pending_count != '0'
        env:
          RUFOUS_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RUFOUS_R2_ACCESS_KEY_ID: ${{ secrets.RUF_R2_ACCESS_KEY_ID }}
          RUFOUS_R2_SECRET_ACCESS_KEY: ${{ secrets.RUF_R2_SECRET_ACCESS_KEY }}
        run: >-
          uv run --package databox --extra r2 --locked
          python scripts/publish_rufous_media.py
          --source build/rufous-selected-media
          --approvals config/rufous-media-visual-approvals.json
          --provider "$RUFOUS_MEDIA_PROVIDER"
          --r2
          --prefix rufous-media/v1/objects
          --dry-run
      - name: Recheck the main branch head before media publication
        if: steps.pending-media.outputs.pending_count != '0'
        shell: bash
        run: |
          read -r main_sha _ < <(git ls-remote --refs origin refs/heads/main)
          if [[ ! "$main_sha" =~ ^[0-9a-f]{40}$ || "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "Refusing to publish media for a superseded main revision." >&2
            exit 1
          fi
      - name: Publish only the approved provider media objects
        if: steps.pending-media.outputs.pending_count != '0'
        env:
          RUFOUS_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RUFOUS_R2_ACCESS_KEY_ID: ${{ secrets.RUF_R2_ACCESS_KEY_ID }}
          RUFOUS_R2_SECRET_ACCESS_KEY: ${{ secrets.RUF_R2_SECRET_ACCESS_KEY }}
        run: >-
          uv run --package databox --extra r2 --locked
          python scripts/publish_rufous_media.py
          --source build/rufous-selected-media
          --approvals config/rufous-media-visual-approvals.json
          --provider "$RUFOUS_MEDIA_PROVIDER"
          --r2
          --prefix rufous-media/v1/objects
      - name: Recheck the main branch head before Pages deployment
        if: steps.pending-media.outputs.pending_count != '0'
        shell: bash
        run: |
          read -r main_sha _ < <(git ls-remote --refs origin refs/heads/main)
          if [[ ! "$main_sha" =~ ^[0-9a-f]{40}$ || "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "Refusing to deploy a revision that is no longer the main branch head." >&2
            exit 1
          fi
      - name: Deploy immutable static Pages release
        if: steps.pending-media.outputs.pending_count != '0'
        working-directory: ${{ runner.temp }}
        env:
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          "${{ github.workspace }}/app/node_modules/.bin/wrangler" pages deploy
          "${{ github.workspace }}/app/dist"
          --project-name "$CLOUDFLARE_PAGES_PROJECT"
          --branch main
          --commit-hash "${{ github.sha }}"
      - name: Recheck the main branch head before R2 activation
        if: steps.pending-media.outputs.pending_count != '0'
        shell: bash
        run: |
          read -r main_sha _ < <(git ls-remote --refs origin refs/heads/main)
          if [[ ! "$main_sha" =~ ^[0-9a-f]{40}$ || "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "Refusing to activate R2 data for a superseded main revision." >&2
            exit 1
          fi
      - name: Publish and activate the audited immutable R2 delta release
        if: steps.pending-media.outputs.pending_count != '0'
        env:
          RUFOUS_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RUFOUS_R2_ACCESS_KEY_ID: ${{ secrets.RUF_R2_ACCESS_KEY_ID }}
          RUFOUS_R2_SECRET_ACCESS_KEY: ${{ secrets.RUF_R2_SECRET_ACCESS_KEY }}
        run: >-
          uv run --package databox --extra r2 --locked
          python scripts/publish_rufous_public.py
          --source build/rufous-public-data
          --r2
          --prefix rufous-public
          --publication-sequence "$GITHUB_RUN_ID"
          --publication-attempt "$GITHUB_RUN_ATTEMPT"
          --source-revision "$GITHUB_SHA"

  audio_prepare:
    name: Prepare reviewed bird audio without cloud credentials
    needs: [production_readiness, route]
    if: >-
      needs.production_readiness.outputs.production_ready == 'true' &&
      needs.route.outputs.release_mode == 'audio' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.release_mode == 'audio-refresh'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Build the checksum-pinned FFmpeg sanitizer
        shell: bash
        run: |
          archive="$RUNNER_TEMP/ffmpeg-7.1.1.tar.xz"
          source_root="$RUNNER_TEMP/ffmpeg-7.1.1"
          install_root="$RUNNER_TEMP/rufous-ffmpeg"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            https://ffmpeg.org/releases/ffmpeg-7.1.1.tar.xz
          echo "733984395e0dbbe5c046abda2dc49a5544e7e0e1e2366bba849222ae9e3a03b1  $archive" \
            | sha256sum --check --strict
          tar --extract --file "$archive" --directory "$RUNNER_TEMP"
          cd "$source_root"
          ./configure \
            --prefix="$install_root" \
            --disable-autodetect \
            --disable-debug \
            --disable-doc \
            --disable-ffplay \
            --disable-network \
            --disable-shared \
            --disable-x86asm \
            --enable-static
          make --jobs=2 ffmpeg ffprobe
          make install
          echo "$install_root/bin" >> "$GITHUB_PATH"
      - name: Verify the pinned audio sanitizer toolchain
        shell: bash
        run: |
          ffmpeg_version="$(ffmpeg -version | sed -n '1s/^ffmpeg version \([^ ]*\).*/\1/p')"
          ffprobe_version="$(ffprobe -version | sed -n '1s/^ffprobe version \([^ ]*\).*/\1/p')"
          if [[ "$ffmpeg_version" != "7.1.1" && "$ffmpeg_version" != "7.1.1-static" ]]; then
            echo "Refusing an unpinned FFmpeg toolchain." >&2
            exit 1
          fi
          if [[ "$ffprobe_version" != "7.1.1" && "$ffprobe_version" != "7.1.1-static" ]]; then
            echo "Refusing an unpinned FFmpeg toolchain." >&2
            exit 1
          fi
      - name: Install focused audio release dependencies
        run: uv sync --all-extras --dev --locked
      - name: Test the bounded public audio release path
        run: >-
          uv run pytest
          tests/test_public_audio_export.py
          tests/test_public_audio_release.py
          tests/test_public_audio_selection.py
          tests/test_rufous_public_workflow.py
          -o "addopts=-v --tb=short"
      - name: Verify this revision is still the main branch head
        shell: bash
        run: |
          read -r main_sha _ < <(git ls-remote --refs origin refs/heads/main)
          if [[ ! "$main_sha" =~ ^[0-9a-f]{40}$ || "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "Refusing to publish audio for a superseded main revision." >&2
            exit 1
          fi
      - name: Reproduce every reviewed object without cloud credentials
        run: >-
          uv run --package databox --locked
          python -m databox.public_audio_release acquire
          --selection config/rufous-public-audio-selection.json
          --output build/rufous-public-audio
      - name: Verify the complete prepared package without cloud credentials
        run: >-
          uv run --package databox --locked
          python -m databox.public_audio_release verify
          --selection config/rufous-public-audio-selection.json
          --source build/rufous-public-audio
      - name: Cache the verified package for the isolated upload job
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/rufous-public-audio
          key: rufous-public-audio-${{ hashFiles('config/rufous-pinned-public-audio.json') }}

  audio_delta:
    name: Upload preverified immutable bird audio
    needs: [production_readiness, route, audio_prepare]
    if: >-
      needs.production_readiness.outputs.production_ready == 'true' &&
      needs.audio_prepare.result == 'success' &&
      needs.route.outputs.release_mode == 'audio' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.release_mode == 'audio-refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install focused audio upload dependencies
        run: uv sync --package databox --extra r2 --locked
      - name: Verify this revision is still the main branch head
        shell: bash
        run: |
          read -r main_sha _ < <(git ls-remote --refs origin refs/heads/main)
          if [[ ! "$main_sha" =~ ^[0-9a-f]{40}$ || "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "Refusing to publish audio for a superseded main revision." >&2
            exit 1
          fi
      - name: Restore only the exactly pinned verified audio package
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/rufous-public-audio
          key: rufous-public-audio-${{ hashFiles('config/rufous-pinned-public-audio.json') }}
          fail-on-cache-miss: true
      - name: Reverify the cached package without cloud credentials
        run: >-
          uv run --package databox --locked
          python -m databox.public_audio_release verify
          --selection config/rufous-public-audio-selection.json
          --source build/rufous-public-audio
      - name: Upload pinned bytes without provider or media-parser access
        env:
          RUFOUS_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RUFOUS_R2_ACCESS_KEY_ID: ${{ secrets.RUF_R2_ACCESS_KEY_ID }}
          RUFOUS_R2_SECRET_ACCESS_KEY: ${{ secrets.RUF_R2_SECRET_ACCESS_KEY }}
        run: >-
          uv run --package databox --extra r2 --locked
          python -m databox.public_audio_release publish-preverified-r2
          --source build/rufous-public-audio
          --selection config/rufous-public-audio-selection.json

  production:
    name: Build and deploy production R2-backed release
    needs: [production_readiness, route]
    if: >-
      needs.production_readiness.outputs.production_ready == 'true' &&
      needs.route.outputs.release_mode == 'full' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RUNTIME__DLTHUB_TELEMETRY: "false"
      SQLMESH__DISABLE_ANONYMIZED_ANALYTICS: "true"
      DAGSTER_HOME: ${{ github.workspace }}/.dagster
      RUF_GNIS_URL: https://prd-tnm.s3.amazonaws.com/StagedProducts/GeographicNames/DomesticNames/DomesticNames_AZ_Text.zip
      RUF_GNIS_ARCHIVE_SHA256: dae54077f01dbef8b7d387fe724b9d46b3689f15c0551e183ebc55b8f9def264
      RUF_GNIS_SHA256: 09c27e2d929947ec47301b41ffeb68bc051b3fa149fe2c49effdb954aaee0b2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: |
          mkdir -p "$DAGSTER_HOME"
          uv sync --all-extras --dev --locked
          npm --prefix app ci
      - name: Test public exporter and release invariant
        run: >-
          uv run pytest tests/test_analytics_contract_inventory.py
          tests/test_public_export.py tests/test_public_export_audit.py
          tests/test_public_audio_export.py tests/test_public_audio_release.py
          tests/test_public_audio_selection.py
          tests/test_public_release.py tests/test_public_media.py
          tests/test_rufous_public_workflow.py
          tests/test_public_media_approval.py
          tests/test_public_media_pin.py
          tests/test_rufous_pinned_public_media.py
          tests/test_source_builders.py tests/test_source_registry.py
          -o "addopts=-v --tb=short"
      - name: Test public occurrence publication model
        working-directory: transforms/main
        run: ../../.venv/bin/sqlmesh test -k test_rufous_public_gbif_eod_occurrence
      - name: Test public browser application
        run: |
          npm --prefix app run typecheck
          npm --prefix app test -- --reporter=dot
      - name: Refresh and model the licensed GBIF publication warehouse
        env:
          DATABOX_GBIF_MAX_RECORDS: "3000"
          DATABOX_GBIF_PUBLIC_RELEASE: "true"
        run: |
          uv run python scripts/load_dlt_quack.py \
            --source gbif \
            --database data/databox.duckdb \
            --skip-sqlmesh
          bash scripts/sqlmesh_plan_rufous_public.sh
      - name: Verify the pinned immutable media catalog
        run: >-
          uv run python scripts/verify_rufous_media_approvals.py
          --manifest config/rufous-pinned-public-media.json
          --approvals config/rufous-media-visual-approvals.json
      - name: Verify the pinned immutable audio catalog without provider contact
        run: >-
          uv run --package databox --locked
          python -m databox.public_audio_release verify-pin
          --selection config/rufous-public-audio-selection.json
          --verify-manifest config/rufous-pinned-public-audio.json
      - name: Verify every pinned immutable audio object exists in R2
        env:
          RUFOUS_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RUFOUS_R2_ACCESS_KEY_ID: ${{ secrets.RUF_R2_ACCESS_KEY_ID }}
          RUFOUS_R2_SECRET_ACCESS_KEY: ${{ secrets.RUF_R2_SECRET_ACCESS_KEY }}
        run: >-
          uv run --package databox --extra r2 --locked
          python -m databox.public_audio_release verify-r2
          --selection config/rufous-public-audio-selection.json
          --verify-manifest config/rufous-pinned-public-audio.json
      - name: Download official Arizona GNIS archive
        run: >-
          curl --fail --silent --show-error --location
          --proto '=https' --proto-redir '=https' --max-filesize 10000000
          --max-time 120 --output data/gnis-arizona.zip "$RUF_GNIS_URL"
      - name: Verify the pinned GNIS archive
        run: >-
          python -c 'import hashlib, os, pathlib;
          path = pathlib.Path("data/gnis-arizona.zip");
          actual = hashlib.sha256(path.read_bytes()).hexdigest();
          expected = os.environ["RUF_GNIS_ARCHIVE_SHA256"];
          assert actual == expected, f"GNIS archive SHA-256 mismatch: {actual}"'
      - name: Extract the pinned GNIS text snapshot
        run: >-
          unzip -j -o data/gnis-arizona.zip
          Text/DomesticNames_AZ.txt -d data
      - name: Export licensed static public projection
        run: >-
          uv run python scripts/export_rufous_public.py
          --mode production
          --database data/databox.duckdb
          --gnis data/DomesticNames_AZ.txt
          --gnis-sha256 "$RUF_GNIS_SHA256"
          --media-manifest config/rufous-pinned-public-media.json
          --media-approvals config/rufous-media-visual-approvals.json
          --audio-manifest config/rufous-pinned-public-audio.json
          --output build/rufous-public-data
      - name: Build static public app
        env:
          VITE_RUFOUS_DATA_BASE_URL: ${{ env.RUFOUS_PUBLIC_DATA_URL }}
        run: npm --prefix app run build:public
      - name: Remove bundled fixture data from the R2-only production shell
        run: rm -rf app/dist/data
      - name: Audit browser bundle configuration
        run: uv run python scripts/audit_app_bundle.py
      - name: Enforce the shell-only public release boundary
        run: >-
          uv run python scripts/audit_rufous_public.py app/dist --shell-only
          --workflows .github/workflows
          --repository-root .
      - name: Enforce the generated public data boundary
        run: >-
          uv run python scripts/audit_rufous_public.py build/rufous-public-data
          --workflows .github/workflows
          --repository-root .
      - name: Verify this revision is still the main branch head
        shell: bash
        run: |
          read -r main_sha _ < <(git ls-remote --refs origin refs/heads/main)
          if [[ ! "$main_sha" =~ ^[0-9a-f]{40}$ || "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "Refusing to deploy a revision that is no longer the main branch head." >&2
            exit 1
          fi
      - name: Preflight monotonic R2 activation before Pages deployment
        env:
          RUFOUS_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RUFOUS_R2_ACCESS_KEY_ID: ${{ secrets.RUF_R2_ACCESS_KEY_ID }}
          RUFOUS_R2_SECRET_ACCESS_KEY: ${{ secrets.RUF_R2_SECRET_ACCESS_KEY }}
        run: >-
          uv run --package databox --extra r2 --locked
          python scripts/publish_rufous_public.py
          --source build/rufous-public-data
          --r2
          --prefix rufous-public
          --publication-sequence "$GITHUB_RUN_ID"
          --publication-attempt "$GITHUB_RUN_ATTEMPT"
          --source-revision "$GITHUB_SHA"
          --dry-run
      - id: changed
        name: Skip only an unchanged scheduled data refresh
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          new_version=$(python -c 'import json; print(json.load(open("build/rufous-public-data/data/manifest.json"))["data_version"])')
          current_version=$(curl --fail --silent --show-error --max-time 15 \
            "$RUFOUS_PUBLIC_DATA_URL/manifest.json" 2>/dev/null \
            | python -c 'import json,sys; print(json.load(sys.stdin).get("data_version", ""))' \
            || true)
          if [[ -n "$current_version" && "$current_version" == "$new_version" ]]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy immutable static Pages release
        if: github.event_name != 'schedule'
        working-directory: ${{ runner.temp }}
        env:
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          "${{ github.workspace }}/app/node_modules/.bin/wrangler" pages deploy
          "${{ github.workspace }}/app/dist"
          --project-name "$CLOUDFLARE_PAGES_PROJECT"
          --branch main
          --commit-hash "${{ github.sha }}"
      - name: Recheck the main branch head before R2 activation
        shell: bash
        run: |
          read -r main_sha _ < <(git ls-remote --refs origin refs/heads/main)
          if [[ ! "$main_sha" =~ ^[0-9a-f]{40}$ || "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "Refusing to activate R2 data for a superseded main revision." >&2
            exit 1
          fi
      - name: Publish and activate audited immutable R2 release
        if: steps.changed.outputs.deploy == 'true'
        env:
          RUFOUS_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RUFOUS_R2_ACCESS_KEY_ID: ${{ secrets.RUF_R2_ACCESS_KEY_ID }}
          RUFOUS_R2_SECRET_ACCESS_KEY: ${{ secrets.RUF_R2_SECRET_ACCESS_KEY }}
        run: >-
          uv run --package databox --extra r2 --locked
          python scripts/publish_rufous_public.py
          --source build/rufous-public-data
          --r2
          --prefix rufous-public
          --publication-sequence "$GITHUB_RUN_ID"
          --publication-attempt "$GITHUB_RUN_ATTEMPT"
          --source-revision "$GITHUB_SHA"
