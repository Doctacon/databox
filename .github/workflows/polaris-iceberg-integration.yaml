name: Polaris Iceberg integration

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    name: Real Polaris/S3 smoke verification
    runs-on: ubuntu-latest
    environment: polaris-iceberg-integration
    env:
      DATABOX_AWS_S3_BUCKET: ${{ secrets.DATABOX_AWS_S3_BUCKET }}
      DATABOX_ICEBERG_WAREHOUSE_PREFIX: integration/${{ github.run_id }}/${{ github.run_attempt }}/warehouse
      DATABOX_AWS_REGION: us-west-1
      EBIRD_API_TOKEN: ${{ secrets.EBIRD_API_TOKEN }}
      NOAA_API_TOKEN: ${{ secrets.NOAA_API_TOKEN }}
      XENO_CANTO_API_KEY: ${{ secrets.XENO_CANTO_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assume the scoped S3 writer role
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ secrets.DATABOX_AWS_ROLE_ARN }}
          role-session-name: databox-polaris-integration
          aws-region: us-west-1
      - name: Generate disposable Polaris credentials
        shell: bash
        run: |
          set -euo pipefail
          postgres_password=$(openssl rand -hex 32)
          client_id="github-actions-$(openssl rand -hex 8)"
          client_secret=$(openssl rand -hex 32)
          printf '::add-mask::%s\n' "$postgres_password"
          printf '::add-mask::%s\n' "$client_id"
          printf '::add-mask::%s\n' "$client_secret"
          {
            echo "DATABOX_POLARIS_POSTGRES_PASSWORD=$postgres_password"
            echo "DATABOX_POLARIS_CLIENT_ID=$client_id"
            echo "DATABOX_POLARIS_CLIENT_SECRET=$client_secret"
            echo "DATABOX_AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}"
            echo "DATABOX_AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}"
            echo "DATABOX_AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}"
            echo "DATABOX_AWS_REGION=${AWS_REGION}"
          } >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install
        run: uv sync --all-extras --dev --locked
      - name: Start disposable Polaris catalog
        run: docker compose -f compose.iceberg.yml up --wait --no-build polaris
      - name: Provision isolated databox_lake catalog
        env:
          DATABOX_AWS_ROLE_ARN: ${{ secrets.DATABOX_AWS_ROLE_ARN }}
        shell: bash
        run: |
          set -euo pipefail
          token=$(curl --fail-with-body --silent \
            --user "${DATABOX_POLARIS_CLIENT_ID}:${DATABOX_POLARIS_CLIENT_SECRET}" \
            -H 'Polaris-Realm: POLARIS' \
            -d grant_type=client_credentials \
            -d scope=PRINCIPAL_ROLE:ALL \
            http://127.0.0.1:8181/api/catalog/v1/oauth/tokens | jq -er .access_token)
          printf '::add-mask::%s\n' "$token"
          warehouse="s3://${DATABOX_AWS_S3_BUCKET}/${DATABOX_ICEBERG_WAREHOUSE_PREFIX}"
          payload=$(jq -n \
            --arg warehouse "$warehouse" \
            --arg role_arn "$DATABOX_AWS_ROLE_ARN" \
            '{catalog: {name: "databox_lake", type: "INTERNAL", readOnly: false,
              properties: {"default-base-location": $warehouse},
              storageConfigInfo: {storageType: "S3", allowedLocations: [$warehouse], roleArn: $role_arn}}}')
          management_url=http://127.0.0.1:8181/api/management/v1
          curl --fail-with-body --silent --show-error --output /dev/null \
            -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -H 'Polaris-Realm: POLARIS' \
            -d "$payload" \
            "${management_url}/catalogs"
          curl --fail-with-body --silent --show-error --output /dev/null \
            -H "Authorization: Bearer ${token}" \
            -H 'Content-Type: application/json' \
            -H 'Polaris-Realm: POLARIS' \
            -d '{"catalogRole":{"name":"integration_writer","properties":{}}}' \
            "${management_url}/catalogs/databox_lake/catalog-roles"
          curl --fail-with-body --silent --show-error --output /dev/null \
            -X PUT \
            -H "Authorization: Bearer ${token}" \
            -H 'Content-Type: application/json' \
            -H 'Polaris-Realm: POLARIS' \
            -d '{"type":"catalog","privilege":"CATALOG_MANAGE_CONTENT"}' \
            "${management_url}/catalogs/databox_lake/catalog-roles/integration_writer/grants"
          curl --fail-with-body --silent --show-error --output /dev/null \
            -X PUT \
            -H "Authorization: Bearer ${token}" \
            -H 'Content-Type: application/json' \
            -H 'Polaris-Realm: POLARIS' \
            -d '{"catalogRole":{"name":"integration_writer"}}' \
            "${management_url}/principal-roles/service_admin/catalog-roles/databox_lake"
      - name: Preflight AWS identity and isolated S3 prefix
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          aws s3api list-objects-v2 \
            --bucket "${DATABOX_AWS_S3_BUCKET}" \
            --prefix "${DATABOX_ICEBERG_WAREHOUSE_PREFIX}" \
            --max-items 1
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      - name: Verify real Polaris/S3 source publication
        run: task verify
      - name: Stop disposable Polaris catalog
        if: always()
        run: |
          cleanup_variable() {
            local name="$1"
            printf '%s=%s' "$name" "${!name:-cleanup}"
          }
          env \
            "$(cleanup_variable DATABOX_POLARIS_POSTGRES_PASSWORD)" \
            "$(cleanup_variable DATABOX_POLARIS_CLIENT_ID)" \
            "$(cleanup_variable DATABOX_POLARIS_CLIENT_SECRET)" \
            docker compose -f compose.iceberg.yml down --volumes
