      - duplicate:
          must_be: 0
  - name: source_scientific_name
    checks:
      - missing:
          must_be: 0
  - name: family
    checks:
      - missing:
          must_be: 0
  - name: order_name
    checks:
      - missing:
          must_be: 0
  - name: avibase_id
    checks:
      - missing:
          must_be: 0
  - name: total_individuals
    checks:
      - missing:
          must_be: 0
  - name: female_individuals
    checks:
      - missing:
          must_be: 0
  - name: male_individuals
    checks:
      - missing:
          must_be: 0
  - name: unknown_sex_individuals
    checks:
      - missing:
          must_be: 0
  - name: complete_measures
    checks:
      - missing:
          must_be: 0
  - name: beak_length_culmen_mm
  - name: beak_length_nares_mm
  - name: beak_width_mm
  - name: beak_depth_mm
  - name: tarsus_length_mm
  - name: wing_length_mm
  - name: kipps_distance_mm
