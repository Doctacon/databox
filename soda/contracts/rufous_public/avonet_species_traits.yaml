    checks:
      - missing:
          must_be: 0
      - invalid:
          valid_values: [10.6084/m9.figshare.16586228.v7]
          must_be: 0
  - name: dataset_version
    checks:
      - missing:
          must_be: 0
      - invalid:
          valid_values: [v7]
          must_be: 0
  - name: dataset_license
    checks:
      - missing:
          must_be: 0
      - invalid:
          valid_values: [CC BY 4.0]
          must_be: 0
  - name: source_file_id
    checks:
      - missing:
          must_be: 0
      - invalid:
          valid_values: [34480856]
          must_be: 0
  - name: source_file_md5
    checks:
      - missing:
          must_be: 0
      - invalid:
          valid_values: [1445afdcfb6df784010c2ca034544bc8]
          must_be: 0
  - name: source_url
    checks:
      - missing:
          must_be: 0
      - invalid:
          valid_values: ["https://ndownloader.figshare.com/files/34480856"]
          must_be: 0
  - name: loaded_at
    checks:
      - missing:
          must_be: 0

checks:
  - row_count:
      must_be_greater_than: 0
