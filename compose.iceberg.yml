name: databox-iceberg

services:
  postgres:
    image: databox-polaris-postgres:17.6-pgbackrest-2.55.1
    build:
      context: .
      dockerfile: scripts/platform/polaris-postgres.Dockerfile
      args:
        PGBACKREST_VERSION: 2.55.1
    environment:
      POSTGRES_DB: polaris
      POSTGRES_USER: polaris
      POSTGRES_PASSWORD: ${DATABOX_POLARIS_POSTGRES_PASSWORD:?set DATABOX_POLARIS_POSTGRES_PASSWORD}
      PGBACKREST_REPO1_CIPHER_PASS: ${PGBACKREST_REPO1_CIPHER_PASS:?set PGBACKREST_REPO1_CIPHER_PASS}
      PGBACKREST_REPO1_S3_KEY: ${DATABOX_BACKUP_AWS_ACCESS_KEY_ID:?set DATABOX_BACKUP_AWS_ACCESS_KEY_ID}
      PGBACKREST_REPO1_S3_KEY_SECRET: ${DATABOX_BACKUP_AWS_SECRET_ACCESS_KEY:?set DATABOX_BACKUP_AWS_SECRET_ACCESS_KEY}
      PGBACKREST_REPO1_S3_TOKEN: ${DATABOX_BACKUP_AWS_SESSION_TOKEN:?set DATABOX_BACKUP_AWS_SESSION_TOKEN}
      PGBACKREST_REPO1_S3_BUCKET: ${DATABOX_CATALOG_BACKUP_BUCKET:?set DATABOX_CATALOG_BACKUP_BUCKET}
      PGBACKREST_REPO1_S3_REGION: ${DATABOX_AWS_REGION:?set DATABOX_AWS_REGION}
      PGBACKREST_REPO1_S3_ENDPOINT: s3.${DATABOX_AWS_REGION:?set DATABOX_AWS_REGION}.amazonaws.com
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=300s
      - -c
      - archive_command=/usr/local/bin/run-pgbackrest --stanza=polaris archive-push %p
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polaris -d polaris"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - polaris_postgres:/var/lib/postgresql/data
      - polaris_postgres_socket:/var/run/postgresql
    restart: unless-stopped

  polaris-bootstrap:
    image: apache/polaris-admin-tool:1.7.0
    depends_on:
      # PostgreSQL becomes healthy only after pgBackRest proves repository,
      # WAL archive, and initial physical-backup readiness.
      postgres:
        condition: service_healthy
    environment:
      polaris.persistence.type: relational-jdbc
      quarkus.datasource.username: polaris
      quarkus.datasource.password: ${DATABOX_POLARIS_POSTGRES_PASSWORD:?set DATABOX_POLARIS_POSTGRES_PASSWORD}
      quarkus.datasource.jdbc.url: jdbc:postgresql://postgres:5432/polaris
    command:
      - bootstrap
      - -r
      - POLARIS
      - -c
      - POLARIS,${DATABOX_POLARIS_CLIENT_ID:?set DATABOX_POLARIS_CLIENT_ID},${DATABOX_POLARIS_CLIENT_SECRET:?set DATABOX_POLARIS_CLIENT_SECRET}
    restart: "no"

  catalog-backup-readiness:
    image: databox-polaris-postgres:17.6-pgbackrest-2.55.1
    depends_on:
      postgres:
        condition: service_healthy
      polaris-bootstrap:
        condition: service_completed_successfully
    user: postgres
    environment:
      PGBACKREST_REPO1_CIPHER_PASS: ${PGBACKREST_REPO1_CIPHER_PASS:?set PGBACKREST_REPO1_CIPHER_PASS}
      PGBACKREST_REPO1_S3_KEY: ${DATABOX_BACKUP_AWS_ACCESS_KEY_ID:?set DATABOX_BACKUP_AWS_ACCESS_KEY_ID}
      PGBACKREST_REPO1_S3_KEY_SECRET: ${DATABOX_BACKUP_AWS_SECRET_ACCESS_KEY:?set DATABOX_BACKUP_AWS_SECRET_ACCESS_KEY}
      PGBACKREST_REPO1_S3_TOKEN: ${DATABOX_BACKUP_AWS_SESSION_TOKEN:?set DATABOX_BACKUP_AWS_SESSION_TOKEN}
      PGBACKREST_REPO1_S3_BUCKET: ${DATABOX_CATALOG_BACKUP_BUCKET:?set DATABOX_CATALOG_BACKUP_BUCKET}
      PGBACKREST_REPO1_S3_REGION: ${DATABOX_AWS_REGION:?set DATABOX_AWS_REGION}
      PGBACKREST_REPO1_S3_ENDPOINT: s3.${DATABOX_AWS_REGION:?set DATABOX_AWS_REGION}.amazonaws.com
    command: ["python3", "/opt/databox/catalog-backup-readiness.py"]
    volumes:
      - polaris_postgres:/var/lib/postgresql/data
      - polaris_postgres_socket:/var/run/postgresql
    restart: "no"

  polaris:
    image: apache/polaris:1.7.0
    depends_on:
      postgres:
        condition: service_healthy
      polaris-bootstrap:
        condition: service_completed_successfully
      catalog-backup-readiness:
        condition: service_completed_successfully
    environment:
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      QUARKUS_DATASOURCE_USERNAME: polaris
      QUARKUS_DATASOURCE_PASSWORD: ${DATABOX_POLARIS_POSTGRES_PASSWORD:?set DATABOX_POLARIS_POSTGRES_PASSWORD}
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/polaris
      POLARIS_REALM_CONTEXT_REALMS: POLARIS
      POLARIS_REALM_CONTEXT_REQUIRE_HEADER: "false"
      AWS_ACCESS_KEY_ID: ${DATABOX_AWS_ACCESS_KEY_ID:?set DATABOX_AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${DATABOX_AWS_SECRET_ACCESS_KEY:?set DATABOX_AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${DATABOX_AWS_SESSION_TOKEN:?set DATABOX_AWS_SESSION_TOKEN}
      AWS_REGION: ${DATABOX_AWS_REGION:?set DATABOX_AWS_REGION}
      QUARKUS_HTTP_CORS_ENABLED: "true"
      QUARKUS_HTTP_CORS_ORIGINS: http://127.0.0.1:8080
      QUARKUS_HTTP_CORS_METHODS: GET,POST,PUT,DELETE,PATCH,OPTIONS
      QUARKUS_HTTP_CORS_HEADERS: Content-Type,Authorization,Polaris-Realm,X-Request-ID
      QUARKUS_HTTP_CORS_EXPOSED_HEADERS: "*"
      QUARKUS_HTTP_CORS_ACCESS_CONTROL_ALLOW_CREDENTIALS: "true"
    ports:
      - "127.0.0.1:8181:8181"
      - "127.0.0.1:8182:8182"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8182/q/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  polaris-console:
    build:
      context: scripts/platform
      dockerfile: polaris-console.Dockerfile
    depends_on:
      polaris:
        condition: service_healthy
    environment:
      VITE_POLARIS_API_URL: http://127.0.0.1:8181
      VITE_POLARIS_REALM: POLARIS
      VITE_POLARIS_PRINCIPAL_SCOPE: PRINCIPAL_ROLE:ALL
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  polaris_postgres:
    name: databox_polaris_postgres
  polaris_postgres_socket:
